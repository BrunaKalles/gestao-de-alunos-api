name: Testes de API

on:
  schedule:
    #crononograma de execução
    # 1º - minuto, 2º - hora,  3º - dia do mês, 4º - mês, 5º - dia da semana
    - cron: '0 0 * * *' # todo dia, à meia-noite


  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test

      - name: Salvando relatório de testes
        uses: actions/upload-artifact@v4
        if: ${{always()}}
        with:
          path: reports/results.xml
          name: relatorio-testes